<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CHAMS – Notification System</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

<style>
    *{ margin:0; padding:0; box-sizing:border-box; font-family:"Segoe UI", Roboto, Arial, sans-serif; }
    
    body {
        background: #1f1f1f; 
        overflow: hidden;
        width: 100%;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #notifOverlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.7); 
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
    }

    .notification-panel {
        background: #0b4a7a;
        width: 35vw;
        min-width: 450px;
        padding: 6vh 3vw;
        border-radius: 1.5vw;
        text-align: center;
        box-shadow: 0 2vw 5vw rgba(0, 0, 0, 0.8);
        color: white;
        position: relative; /* Needed for the X button positioning */
        animation: zoomIn 0.3s ease-out;
    }

    /* --- NEW X BUTTON STYLING --- */
    .close-notif-x {
        position: absolute;
        top: 20px;
        right: 25px;
        font-size: 1.8vw;
        cursor: pointer;
        color: rgba(255, 255, 255, 0.7);
        transition: 0.3s ease;
    }

    .close-notif-x:hover {
        color: #ff2d8d; /* Pink highlight on hover */
        transform: scale(1.2) rotate(90deg);
    }

    @keyframes zoomIn {
        from { transform: scale(0.8); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }

    .notification-panel i.main-bell { font-size: 5vw; margin-bottom: 2vh; display: block; }
    .notif-title { font-size: 2vw; font-weight: bold; margin-bottom: 4vh; letter-spacing: 1px; }

    #notifList { width: 100%; max-height: 40vh; overflow-y: auto; padding-right: 5px; }

    .notif-item {
        background: rgba(255, 255, 255, 0.95);
        color: #333;
        padding: 2.5vh 1.5vw;
        margin-bottom: 2vh;
        border-radius: 0.8vw;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        font-weight: 700;
        font-size: 1.2vw;
        transition: 0.2s ease;
    }

    .notif-item:hover { background: #ffffff; transform: translateY(-3px); }
    .notif-item i { color: #0b4a7a; font-size: 1vw; }

    .clear-btn {
        margin-top: 3vh;
        background: #ffffff;
        border: none;
        padding: 1.5vh 3vw;
        border-radius: 3vw;
        font-weight: 800;
        color: #0b4a7a;
        cursor: pointer;
        font-size: 1vw;
        text-transform: uppercase;
        transition: 0.3s;
    }
    .clear-btn:hover { background: #e6e6e6; }

    /* --- STOCK MODAL --- */
    .stock-modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.85);
        z-index: 2000;
    }

    .stock-container {
        background: #ff7a00;
        width: 42vw;
        padding: 6vh 4vw;
        border-radius: 2vw;
        text-align: center;
        color: white;
    }

    .stock-message {
        background: #e2caa1;
        color: #222;
        padding: 4vh;
        border-radius: 1vw;
        margin-top: 2vh;
        font-size: 1.3vw;
        text-align: left;
        font-weight: 600;
    }

    .close-alert-btn {
        margin-top: 4vh;
        padding: 1.8vh 4vw;
        border: none;
        background: #0b4a7a;
        color: #fff;
        border-radius: 1vw;
        cursor: pointer;
        font-weight: bold;
    }

    #notifList::-webkit-scrollbar { width: 6px; }
    #notifList::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 10px; }
</style>
</head>

<body>

    <div id="notifOverlay">
        <div class="notification-panel">
            
            <i class="fas fa-times close-notif-x" onclick="closeNotif()" title="Back to Home"></i>

            <i class="fas fa-bell main-bell"></i>
            <div class="notif-title">NOTIFICATIONS</div>

            <div id="notifList">
                <div class="notif-item" onclick="openStockAlert()">
                    <span>⚠️ Low Stock Alert!</span>
                    <i class="fas fa-arrow-right"></i>
                </div>

                <div class="notif-item">
                    <span>🎫 Ticket Status Updated</span>
                    <i class="fas fa-arrow-right"></i>
                </div>

                <div class="notif-item">
                    <span>📅 Maintenance Due Today</span>
                    <i class="fas fa-arrow-right"></i>
                </div>
            </div>

            <button class="clear-btn" onclick="clearAll()">Clear All</button>
        </div>
    </div>

    <div class="stock-modal" id="stockModal">
        <div class="stock-container">
            <i class="fas fa-exclamation-triangle" style="font-size: 4vw; margin-bottom: 2vh;"></i>
            <h1 style="font-size: 2.5vw; margin-bottom: 10px;">STOCK ALERT</h1>
            <div class="stock-message">
                <b>CRITICAL ITEMS DETECTED:</b>
                <br><br>
                • Printer Ink (2 remaining)<br>
                • Bond Paper (5 remaining)<br>
                • Ethernet Cables (1 remaining)
            </div>
            <button class="close-alert-btn" onclick="closeStock()">CLOSE ALERT</button>
        </div>
    </div>

    <script>
        // Redirect back to home
        function closeNotif() {
            window.location.href = "DASHBOARD.html";
        }

        function openStockAlert() {
            document.getElementById("stockModal").style.display = "flex";
        }

        function closeStock() {
            document.getElementById("stockModal").style.display = "none";
        }

        function clearAll() {
            const list = document.getElementById("notifList");
            list.innerHTML = `
                <div style="padding: 20px; opacity: 0.6; font-style: italic; font-size: 1.2vw;">
                    No new notifications
                </div>
            `;
            document.querySelector(".clear-btn").style.display = "none";
        }
    </script>

</body>
</html>
