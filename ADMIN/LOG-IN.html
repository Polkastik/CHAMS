<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CHAMS – MISD</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI", Arial, sans-serif;
}

body{
    background:#1e1e1e;
}

.wrapper{
    width:90%;
    height:85vh;
    margin:40px auto;
    display:flex;
    background:#ffffff;
    border-radius:12px;
    overflow:hidden;
}

.left{
    width:55%;
    position:relative;
    background:url("left-bg.jpg") center / cover no-repeat;
    color:#ffffff;

    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.left::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.55);
}

.left-content{
    position:relative;
    z-index:1;
    padding:70px 60px;
}

.left h1{
    font-size:36px;
    margin-bottom:20px;
}

.left p{
    font-size:18px;
    line-height:1.7;
}

.left strong{
    color:#3431bd;
}
.left{ 
    width:55%;
    position:relative;
    background: #4facfe url("BLUEBG.jpg") center / cover no-repeat; 
    color:#ffffff;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    opacity: 0.95;
}
.right{
    width:45%;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    width:70%;
    text-align:center;
}

.logo{
    width:275px;
    margin-bottom:20px;
}

.card h4{
    margin-bottom:20px;
    font-weight:500;
}

input{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:4px;
}

button{
    width:100%;
    padding:10px;
    margin-top:10px;
    background:#0b4f8a;
    color:white;
    border:none;
    border-radius:4px;
    cursor:pointer;
}

button:hover{
    background:#083e6b;
}

a{
    display:block;
    margin-top:8px;
    font-size:13px;
    color:#0b4f8a;
    text-decoration:none;
    cursor:pointer;
}

.hidden{
    display:none;
}

@media(max-width:768px){
    .wrapper{
        flex-direction:column;
        height:auto;
    }
    .left,.right{
        width:100%;
    }
    .left-content{
        padding:50px 30px;
    }
}
</style>
</head>

<body>

<div class="wrapper">

    <div class="left">
        <div class="left-content">
            <h1>Welcome Back to<br>CHAMS – MISD</h1>
            <p>
                Efficient IT Services.<br>
                Accurate Asset Control.<br>
                <strong>ONE</strong> Platform.
            </p>
        </div>
    </div>

    
    <div class="right">
        <div class="card">

            
            <img src="CHAMS.png" alt="CHAMS Logo" class="logo">

            
            <div id="login">
                <h4>Welcome! Please Log in.</h4>
                <input type="text" placeholder="Employee ID">
                <input type="password" placeholder="Password">
                <button>Login</button>
                <a onclick="showForgot()">Forgot Password?</a>
            </div>

           
            <div id="forgot" class="hidden">
                <h4>Forgot Password?</h4>
                <input type="text" placeholder="Employee ID">
                <button>Submit</button>
                <a onclick="showLogin()">Log In</a>
            </div>

        </div>
    </div>

</div>

<script>
function showForgot(){
    document.getElementById("login").classList.add("hidden");
    document.getElementById("forgot").classList.remove("hidden");
}

function showLogin(){
    document.getElementById("forgot").classList.add("hidden");
    document.getElementById("login").classList.remove("hidden");
}
</script>

</body>
</html>
