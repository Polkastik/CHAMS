<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAMS - Notifications</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --hams-blue: #00407a;
            --sidebar-bg: #e9eff5;
            --text-main: #003366;
            --border-color: #bcccdc;
            --notification-bg: #e6e6e6;
            --bg-hover: #f5f7fa;
        }

        /* Fluid Reset */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial Narrow', sans-serif; }
        body { display: flex; height: 100vh; background-color: #f4f7f9; overflow: hidden; width: 100%; font-size: 100%; }

        /* --- HEADER --- */ 
        header { 
            background-color: var(--hams-blue); height: 8vh; display: flex; align-items: center; 
            justify-content: space-between; padding: 0 2%; position: fixed; top: 0; width: 100%; z-index: 1001; 
        } 
        .header-left { display: flex; align-items: center; gap: 2vw; color: white; height: 100%; } 
        .menu-toggle { font-size: 2.5vh; cursor: pointer; color: white; padding: 10px; } 
        .logo-img { height: 80%; width: auto; mix-blend-mode: screen; filter: brightness(1.1); } 
        .search-container { background: white; border-radius: 0.5vw; display: flex; align-items: center; padding: 0.3% 1%; width: 20%; box-shadow: inset 0 0.1vh 0.3vh rgba(0,0,0,0.1); } 
        .search-container input { border: none; outline: none; width: 100%; font-size: 80%; } 
        .search-container i { color: #aaa; font-size: 80%; } 

        /* --- SIDEBAR --- */ 
        .sidebar { 
            width: 15%; background-color: var(--sidebar-bg); padding-top: 8vh; display: flex; 
            flex-direction: column; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            border-right: 0.1vw solid #d1d9e0; overflow-x: hidden; overflow-y: auto; 
            box-shadow: 0.2vw 0 0.5vw rgba(0,0,0,0.05); height: 100%; z-index: 1000;
        } 
        .sidebar::-webkit-scrollbar { display: none; } 
        .sidebar.collapsed { width: 6.5%; } 
        
        .profile-area { text-align: center; padding: 10% 5%; transition: opacity 0.2s; } 
        .sidebar.collapsed .profile-area { display: none; } 
        .profile-icon-big { font-size: 500%; color: var(--text-main); margin-bottom: 2%; } 
        .profile-name { font-weight: bold; color: var(--text-main); margin-bottom: 3%; font-size: 90%; white-space: nowrap; } 
        .staff-badge { background: white; border: 0.1vw solid #ccc; border-radius: 1vw; padding: 1% 10%; font-size: 65%; display: inline-block; color: var(--text-main); font-weight: bold; } 
        
        .nav-list { flex-grow: 1; margin-top: 5%; display: flex; flex-direction: column; } 
        .nav-item { display: flex; align-items: center; padding: 5% 15%; text-decoration: none; color: var(--text-main); font-weight: bold; font-size: 80%; text-transform: uppercase; white-space: nowrap; transition: background 0.2s, border-left 0.2s; border-left: 0.3vw solid transparent; cursor: pointer; } 
        .nav-item.active { background: #dce4ed; border-left: 0.3vw solid var(--hams-blue); } 
        .nav-item i { font-size: 150%; width: 20%; margin-right: 10%; text-align: center; } 
        
        /* CHAMS Standard: Profile visibility logic */
        .nav-item[data-page="Profile"] { display: none; }
        .sidebar.collapsed .nav-item[data-page="Profile"] { display: flex; }

        .sidebar.collapsed .nav-item { flex-direction: column; justify-content: center; padding: 12% 0; text-align: center; border-left: none; border-right: 0.3vw solid transparent; } 
        .sidebar.collapsed .nav-item.active { border-right: 0.3vw solid var(--hams-blue); border-left: none; } 
        .sidebar.collapsed .nav-item i { margin-right: 0; margin-bottom: 5%; width: 100%; font-size: 160%; } 
        .sidebar.collapsed .nav-item span { display: block; font-size: 55%; letter-spacing: 0; } 
        
        .dot { color: #ff007f; margin-left: 3%; font-size: 110%; } 
        .sign-out-container { margin-top: auto; border-top: 0.1vw solid #cbd5e0; margin-bottom: 2vh; }

        /* --- CONTENT AREA --- */
        .main-wrapper { flex: 1; margin-top: 8vh; padding: 2.5rem 3%; overflow-y: auto; min-width: 0; position: relative; }

        .page-header { display: inline-flex; align-items: center; gap: 0.8rem; margin-bottom: 1.5rem; color: var(--hams-blue); cursor: pointer; transition: 0.2s; padding: 8px 15px; border-radius: 8px; }
        .page-header:hover { background: #e9eff5; transform: translateX(-5px); }
        .page-header h2 { font-size: 1.5rem; text-transform: uppercase; letter-spacing: 1px; }

        .placeholder-view { display: none; text-align: center; padding: 5rem 2rem; background: white; border-radius: 8px; border: 1px solid var(--border-color); color: #666; margin-top: 2%; }
        .placeholder-view i { font-size: 4rem; color: #ccc; margin-bottom: 1rem; }

        /* --- NOTIFICATION PANEL STYLES --- */
        #notificationContentView { display: block; }
        .notification-panel {
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: var(--hams-blue);
            padding: 40px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .bell-icon { font-size: 50px; color: #000; margin-bottom: 30px; position: relative; }
        .bell-icon::after { content: '+'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--hams-blue); font-size: 18px; font-weight: bold; }

        .notif-list { width: 100%; display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; }
        .notif-item {
            background-color: var(--notification-bg);
            padding: 15px 40px;
            text-align: center;
            color: #000;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 14px;
            position: relative;
            transition: opacity 0.3s, transform 0.3s;
            border-radius: 4px;
        }

        .close-btn { position: absolute; top: 5px; right: 10px; font-size: 18px; cursor: pointer; color: black; font-family: sans-serif; }
        .close-btn:hover { color: red; }

        .clear-all-btn {
            background-color: white; color: var(--hams-blue); border: none; padding: 12px 40px;
            border-radius: 25px; font-size: 14px; cursor: pointer; text-transform: uppercase;
            font-weight: bold; transition: background 0.2s;
        }
        .clear-all-btn:hover { background-color: #f0f0f0; }
        .empty-msg { color: white; display: none; margin-bottom: 20px; font-family: sans-serif; }

        @media (max-width: 1024px) {
            .sidebar { width: 250px; position: absolute; left: -250px; }
            .sidebar.mobile-open { left: 0; }
            .main-wrapper { margin-left: 0 !important; }
        }
    </style>
</head>
<body>

    <header> 
        <div class="header-left"> 
            <i class="fas fa-bars menu-toggle" id="toggleBtn"></i> 
            <img src="CHAMS LOGO.jpg" alt="CHAMS Logo" class="logo-img"> 
        </div> 
        <div class="search-container"> 
            <input type="text" id="searchInput" placeholder="Search..."> 
            <i class="fas fa-search"></i> 
        </div> 
    </header> 

    <nav class="sidebar" id="sidebar"> 
        <div class="profile-area"> 
            <div class="profile-icon-big"><i class="fas fa-user-circle"></i></div> 
            <div class="profile-name">Kenneth F.</div> 
            <div class="staff-badge">STAFF | 2.0.1 <i class="fas fa-cog"></i></div> 
        </div> 
        <div class="nav-list" id="mainNav"> 
            <a href="#" class="nav-item" data-page="Profile"><i class="fas fa-user-circle"></i><span>Profile</span></a> 
            <a href="#" class="nav-item" data-page="Home"><i class="fas fa-home"></i><span>Home</span></a> 
            <a href="#" class="nav-item" data-page="Tickets"><i class="fas fa-file-invoice"></i><span>Tickets</span></a> 
            <a href="#" class="nav-item" data-page="Inventory"><i class="fas fa-folder"></i><span>Inventory</span></a> 
            <a href="#" class="nav-item" data-page="Activity Log"><i class="fas fa-history"></i><span>Activity Log</span></a> 
            <a href="#" class="nav-item active" data-page="Notifications"><i class="fas fa-bell"></i><span>Notification<b class="dot">●</b></span></a> 
            <a href="#" class="nav-item" data-page="Settings"><i class="fas fa-cog"></i><span>Settings</span></a> 
            <a href="#" class="nav-item" data-page="FAQs"><i class="fas fa-question-circle"></i><span>FAQs</span></a> 
        </div> 
        <div class="sign-out-container"> 
            <a href="#" class="nav-item" id="signOutBtn"><i class="fas fa-sign-out-alt"></i><span>Sign Out</span></a> 
        </div> 
    </nav>

    <div class="main-wrapper">
        <div class="page-header" id="pageHeaderBtn">
            <i class="fas fa-chevron-left"></i>
            <h2 id="pageTitle">Notifications</h2>
        </div>

        <div class="placeholder-view" id="placeholderView">
            <i class="fas fa-tools"></i>
            <h3 id="placeholderTitle">Module Name</h3>
            <p>This module is currently under construction. Please check back later.</p>
        </div>

        <div id="notificationContentView">
            <div class="notification-panel">
                <i class="fas fa-bell bell-icon"></i>
                
                <div class="notif-list" id="notifList">
                    <div class="notif-item">
                        <span class="close-btn" onclick="removeNotification(this)">x</span>
                        New Ticket Assigned
                    </div>
                    <div class="notif-item">
                        <span class="close-btn" onclick="removeNotification(this)">x</span>
                        Ticket Status Updated
                    </div>
                </div>

                <div class="empty-msg" id="emptyMsg">No new notifications</div>
                <button class="clear-all-btn" onclick="clearAll()">CLEAR ALL</button>
            </div>
        </div>
    </div>

    <script>
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('toggleBtn');
        const navItems = document.querySelectorAll('.nav-item');
        const notifContentView = document.getElementById('notificationContentView');
        const placeholderView = document.getElementById('placeholderView');
        const pageTitle = document.getElementById('pageTitle');
        const placeholderTitle = document.getElementById('placeholderTitle');

        // Sidebar Toggle Logic
        toggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (window.innerWidth > 1024) sidebar.classList.toggle('collapsed');
            else sidebar.classList.toggle('mobile-open');
        });

        // CENTRALIZED VIEW SWITCHER
        function switchView(pageName) {
            navItems.forEach(nav => nav.classList.remove('active'));
            const activeItem = Array.from(navItems).find(i => i.getAttribute('data-page') === pageName);
            if(activeItem) activeItem.classList.add('active');

            if (pageName === 'Notifications') {
                pageTitle.innerText = "Notifications";
                notifContentView.style.display = 'block';
                placeholderView.style.display = 'none';
            } else {
                pageTitle.innerText = pageName;
                notifContentView.style.display = 'none';
                placeholderView.style.display = 'block';
                placeholderTitle.innerText = `${pageName} Dashboard`;
            }
        }

        navItems.forEach(item => {
            item.addEventListener('click', function() {
                if (this.id === 'signOutBtn') return;
                switchView(this.getAttribute('data-page'));
                if (window.innerWidth <= 1024) sidebar.classList.remove('mobile-open');
            });
        });

        // Breadcrumb Navigation back to Home
        document.getElementById('pageHeaderBtn').addEventListener('click', () => switchView('Home'));

        // Sign out Standard Logic
        document.getElementById('signOutBtn').addEventListener('click', () => {
            if(confirm("Are you sure you want to sign out?")) {
                document.body.innerHTML = `<div style="display:flex; height:100vh; width:100%; align-items:center; justify-content:center; flex-direction:column; background:var(--hams-blue); color:white;"><i class="fas fa-circle-notch fa-spin" style="font-size: 3rem; margin-bottom: 1rem;"></i><h2>Signing Out...</h2></div>`;
                setTimeout(() => location.reload(), 1500);
            }
        });

        // Notification Logic
        function removeNotification(element) {
            const item = element.parentElement;
            item.style.opacity = '0';
            item.style.transform = 'scale(0.9)';
            setTimeout(() => {
                item.remove();
                checkEmpty();
            }, 300);
        }

        function clearAll() {
            const items = document.querySelectorAll('.notif-item');
            items.forEach((item, index) => {
                setTimeout(() => {
                    item.style.opacity = '0';
                    item.style.transform = 'scale(0.9)';
                    setTimeout(() => item.remove(), 300);
                }, index * 100);
            });
            setTimeout(checkEmpty, items.length * 100 + 300);
        }

        function checkEmpty() {
            const list = document.getElementById('notifList');
            if (list.children.length === 0) {
                document.getElementById('emptyMsg').style.display = 'block';
            }
        }

        // Close UI elements on click away
        document.addEventListener('click', (e) => {
            if (window.innerWidth <= 1024 && !sidebar.contains(e.target) && e.target !== toggleBtn) {
                sidebar.classList.remove('mobile-open');
            }
        });
        sidebar.addEventListener('click', (e) => e.stopPropagation());
    </script>
</body>
</html>
