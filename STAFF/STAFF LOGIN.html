<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAMS Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --hams-blue: #00407a;
            --hams-dark: #002a52;
            --bg-light: #f4f7f9;
            --roundness: 25px; 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            background-color: var(--bg-light);
            overflow: hidden;
        }

        /* --- LEFT PANEL --- */
        .left-panel {
            width: 60%;
            background-image: url('BLUE BG.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 80px;
            box-shadow: inset 0 0 0 1000px rgba(0, 0, 0, 0.2); 
            transition: 0.3s;
        }

        .left-content {
            position: relative;
            z-index: 10;
            color: white;
            max-width: 600px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .welcome-small { font-size: 1.2rem; opacity: 0.9; margin-bottom: 5px; }
        .brand-large { font-size: clamp(2.5rem, 5vw, 4rem); font-weight: 800; margin-bottom: 20px; line-height: 1; }
        .tagline { font-size: 1.5rem; line-height: 1.4; font-weight: 300; }
        .tagline strong { font-weight: 900; color: #fff; border-bottom: 3px solid var(--hams-blue); }

        /* --- RIGHT PANEL --- */
        .right-panel {
            width: 40%;
            background-color: var(--bg-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            z-index: 5;
            transition: 0.3s;
        }

        .logo-area {
            margin-bottom: 1px;
            display: flex;
            justify-content: center;
        }

        .logo-img {
            width: 250px;
            height: auto;
            mix-blend-mode: multiply;
        }

        .form-title {
            color: #555;
            margin-bottom: 25px;
            font-size: 1rem;
            font-weight: 600;
        }

        .login-form {
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* View Switching logic */
        #forgotView { display: none; }

        .input-group { position: relative; width: 100%; }
        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            font-size: 0.9rem;
        }

        .form-input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            border: 1.5px solid #ddd;
            border-radius: var(--roundness);
            font-size: 0.9rem;
            outline: none;
            background: white;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            border-color: var(--hams-blue);
            box-shadow: 0 0 8px rgba(0, 64, 122, 0.1);
        }

        .btn-action {
            background-color: var(--hams-blue);
            color: white;
            border: none;
            padding: 14px;
            border-radius: var(--roundness);
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 64, 122, 0.2);
        }

        .btn-action:hover {
            background-color: var(--hams-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 64, 122, 0.3);
        }

        .btn-action:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .toggle-link {
            text-align: center;
            color: var(--hams-blue);
            text-decoration: none;
            font-size: 0.8rem;
            margin-top: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .toggle-link:hover { text-decoration: underline; }

        .error-msg {
            color: #d9534f;
            font-size: 0.8rem;
            text-align: center;
            display: none;
            margin-bottom: 10px;
        }

        /* --- RESPONSIVENESS --- */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .left-panel { width: 100%; height: 35%; padding: 30px; align-items: center; text-align: center; }
            .right-panel { width: 100%; height: 65%; padding: 20px; }
            .brand-large { font-size: 2.2rem; }
            .tagline { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <div class="left-panel">
        <div class="left-content">
            <div class="welcome-small">Welcome Back to</div>
            <div class="brand-large">CHAMS - MISD</div>
            <div class="tagline">
                Efficient IT Services. Accurate Asset Control. <strong>ONE</strong> Platform.
            </div>
        </div>
    </div>

    <div class="right-panel">
        <div class="logo-area">
            <img src="CHAMS%20LOGO.png" alt="CHAMS Logo" class="logo-img">
        </div>

        <div id="loginView" class="login-form">
            <div class="form-title" style="text-align: center;">Portal Access</div>
            <div class="error-msg" id="loginError">Invalid Employee ID or Password</div>
            
            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="empId" class="form-input" placeholder="Employee ID" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" class="form-input" placeholder="Password" required>
                </div>
                <button type="submit" class="btn-action" id="loginBtn">Login</button>
                <a class="toggle-link" onclick="toggleViews('forgot')">Forgot Password?</a>
            </form>
        </div>

        <div id="forgotView" class="login-form">
            <div class="form-title" style="text-align: center;">Reset Password</div>
            <p style="font-size: 0.8rem; color: #777; text-align: center; margin-bottom: 10px;">Enter your ID to request a reset link.</p>
            
            <form id="forgotForm" class="login-form">
                <div class="input-group">
                    <i class="fas fa-id-card"></i>
                    <input type="text" id="resetEmpId" class="form-input" placeholder="Employee ID" required>
                </div>
                <button type="submit" class="btn-action" id="forgotBtn">Submit Request</button>
                <a class="toggle-link" onclick="toggleViews('login')">Back to Login</a>
            </form>
        </div>
    </div>

    <script>
        // Toggle between Login and Forgot Password views
        function toggleViews(view) {
            const loginView = document.getElementById('loginView');
            const forgotView = document.getElementById('forgotView');
            if(view === 'forgot') {
                loginView.style.display = 'none';
                forgotView.style.display = 'flex';
            } else {
                loginView.style.display = 'flex';
                forgotView.style.display = 'none';
            }
        }

        // Login Logic
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault()

            const btn = document.getElementById('loginBtn');
            const error = document.getElementById('loginError');
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
            error.style.display = 'none';

            setTimeout(() => {
                const empId = document.getElementById('empId').value;
                const pass = document.getElementById('password').value;

                if(empId === "staff" && pass === "1234") {
                    window.location.href = "STAFF HOMEPAGE!.html";
                } else {
                    error.style.display = 'block';
                    btn.disabled = false;
                    btn.innerText = 'Login';
                }
            }, 1200);
        });

        // Forgot Password Logic
        document.getElementById('forgotForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('forgotBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-paper-plane fa-spin"></i> Processing...';

            setTimeout(() => {
                alert("Request Sent! Kindly Wait for the email in your work account then fill up your new password!");
                btn.disabled = false;
                btn.innerText = 'Submit Request';
                toggleViews('login');
            }, 1500);
        });
    </script>
</body>
</html>
