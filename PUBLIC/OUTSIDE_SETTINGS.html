<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAMS - Settings</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --hams-blue: #00407a;
            --text-main: #003366;
            --sidebar-active: #eef2f6;
            --sidebar-hover: #eef2f6;
            --border-color: #e0e0e0;
        }

        /* Fluid Reset */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; background-color: #f4f7f9; overflow: hidden; width: 100%; }

        /* --- HEADER STYLES --- */
        header {
            background-color: var(--hams-blue);
            height: 8vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2%;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 1.2vw;
            color: white;
        }

        .menu-toggle {
            font-size: 2.2vw;
            cursor: pointer;
            user-select: none;
        }

        .logo-img {
            height: 20vh;
            width: auto;
        }

        .search-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-container input {
            width: 18vw;
            height: 4vh;
            border-radius: 0.4vw;
            border: none;
            padding: 0 2.5vw 0 1vw;
            outline: none;
            font-size: 0.85vw;
        }

        .search-container i {
            position: absolute;
            right: 0.8vw;
            color: #0b4a7a;
            font-size: 0.9vw;
            pointer-events: none;
        }
        /* --- SIDEBAR STYLES --- */
        .sidebar {
            width: 18%;
            background: #ffffff;
            padding: 2.5vh 1.2%;
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding-top: 8vh;
            transition: 0.3s ease;
            border-right: 1px solid var(--border-color);
            overflow: hidden;
            z-index: 900;
            position: fixed;
            left: 0;
            top: 0;
        }

        .profile-card {
            background: #fff;
            padding: 2.5vh 5%;
            text-align: center;
            margin-bottom: 3vh;
            transition: 0.3s ease;
            cursor: pointer;
            text-decoration: none;
        }

        .profile-area-sync { text-align: center; padding: 2vh 5%; transition: opacity 0.2s; }
        .profile-icon-big { font-size: 4.5vw; color: #0b4a7a; margin-bottom: 1vh; }
        .profile-name-sync { font-weight: bold; color: var(--text-main); margin-bottom: 1vh; font-size: 0.95vw; }

        .staff-badge {
            background: white;
            border: 1px solid #ccc;
            border-radius: 1vw;
            padding: 0.2vh 0.8vw;
            font-size: 0.65vw;
            display: inline-block;
            color: var(--text-main);
            font-weight: bold;
            white-space: nowrap;
        }

        .menu { flex: 1; overflow-y: auto; scrollbar-width: none; }
        .menu::-webkit-scrollbar { display: none; }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 0.8vw;
            padding: 1.4vh 10%;
            font-size: 0.85vw;
            font-weight: 600;
            color: #0b4a7a;
            cursor: pointer;
            border-radius: 0.6vw;
            margin-bottom: 0.5vh;
            transition: 0.2s;
            white-space: nowrap;
            text-decoration: none;
        }

        .menu-item i { font-size: 1.3vw; width: 1.5vw; text-align: center; }
        .menu-item:hover, .menu-item.active { background: var(--sidebar-hover); }

        .signout {
            margin-top: auto;
            padding: 1.5vh 10%;
            color: #0b4a7a;
            display: flex;
            align-items: center;
            gap: 0.8vw;
            font-weight: 700;
            font-size: 0.9vw;
            cursor: pointer;
            text-decoration: none;
            border-top: 1px solid #f0f0f0;
        }
        .signout:hover { background: #fff0f0; color: #d11a2a; }

        .sidebar.collapsed { width: 6.5vw; padding: 8vh 0 2vh 0; }
        .sidebar.collapsed .profile-name-sync,
        .sidebar.collapsed .staff-badge,
        .sidebar.collapsed .hide-on-collapse { display: none !important; }
        .sidebar.collapsed .profile-card { padding: 1vh 0; margin-bottom: 1vh; }
        .sidebar.collapsed .profile-icon-big { font-size: 2.5vw; }
        .sidebar.collapsed .profile-label { display: block !important; font-size: 0.7vw; font-weight: 800; color: #0b4a7a; margin-top: 2px; }
        .sidebar.collapsed .menu-item { flex-direction: column; padding: 1.2vh 0; justify-content: center; gap: 2px; }
        .sidebar.collapsed .menu-item span { display: block !important; font-size: 0.65vw; font-weight: 800; }
        .profile-label { display: none; }

        /* --- CONTENT AREA --- */
        .main-wrapper {
            flex: 1;
            margin-top: 8vh;
            margin-left: 18%;
            padding: 1% 2%;
            overflow-y: auto;
            transition: margin-left 0.3s ease;
        }
        .sidebar.collapsed + .main-wrapper { margin-left: 6.5vw; }

        .page-header {
            display: inline-flex;
            align-items: center;
            gap: 1vw;
            margin-bottom: 1.5rem;
            color: var(--hams-blue);
            cursor: pointer;
            padding: 5px;
        }
        .page-header i { font-size: 140%; }
        .page-header h2 { font-size: 140%; text-transform: uppercase; letter-spacing: 1px; }

        /* --- SETTINGS CARD --- */
        .settings-card {
            background: white;
            border-radius: 8px;
            padding: 3rem 5%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
        }

        .user-icon-large { font-size: 6rem; color: var(--hams-blue); margin-bottom: 1rem; }
        .user-title { font-size: 170%; font-weight: bold; color: var(--text-main); margin-bottom: 1rem; text-transform: uppercase; }

        .role-pill {
            background: #f0f0f0;
            padding: 8px 25px;
            border-radius: 25px;
            font-weight: bold;
            color: var(--text-main);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 3rem;
            border: 1px solid #ddd;
        }
        .role-pill i { cursor: pointer; color: #888; }

        /* CENTERED BUG BAR */
        .report-btn {
            width: 80%;
            border: 1px solid #ccc;
            background: white;
            padding: 15px 20px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            font-weight: bold;
            cursor: pointer;
            margin: 0 auto 4rem auto; /* Centered with bottom margin */
        }
        .report-btn i { color: #e74c3c; }

        .logout-btn-large {
            border: 2px solid var(--hams-blue);
            background: white;
            color: var(--hams-blue);
            padding: 12px 40px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .logout-btn-large:hover { background: var(--hams-blue); color: white; }

        /* --- MODALS --- */
        #notifOverlay, #bugOverlay, .stock-modal {
            position:fixed; top:0; left:0; width:100%; height:100%; display:none; align-items:center; justify-content:center; z-index:5000;
        }
        #notifOverlay { background:rgba(0,0,0,0.3); }
        .notification-panel { background:#0b4a7a; width:35vw; padding:6vh 3vw; border-radius:1.5vw; text-align:center; color:white; }

        #bugOverlay { background:rgba(0,0,0,0.65); }
        .bug-container { width:70%; max-width:900px; background:#0b4a7a; border-radius:12px; padding:40px; color:white; }
        .bug-textarea { width:100%; height:200px; margin-top:10px; border-radius:8px; padding:15px; font-size: 1rem; }


        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5); z-index: 2000; align-items: center; justify-content: center;
        }
        .modal-overlay.show { display: flex; }
        .modal-content { background: white; border-radius: 8px; width: 90%; max-width: 400px; padding: 20px; }
        .modal-input { width: 100%; padding: 10px; margin-top: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-save { background: var(--hams-blue); color: white; border:none; padding: 8px 15px; border-radius: 4px; cursor:pointer; }

        .sidebar-action-btn {
            width: 85%;
            margin: 1vh auto 2vh auto;
            padding: 0.9vh 0;
            border: none;
            border-radius: 999px;
            font-weight: bold;
            font-size: 0.8vw;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5vw;
            transition: 0.2s ease;
        }

        /* GREEN NEW BUTTON */
        .btn-new {
            background: #38c172; /* nice green */
            color: white;
        }

        .btn-new:hover {
            background: #2fa463;
            transform: scale(1.03);
        }

    </style>
</head>
<body>

<header>
    <div class="header-left">
        <i class="fas fa-bars menu-toggle" id="toggleBtn"></i>
        <img src="CHAMS%20LOGO.png" alt="CHAMS Logo" class="logo-img">
    </div>
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search...">
        <i class="fas fa-search"></i>
    </div>
</header>


<div class="sidebar" id="sidebar">
        <div class="profile-area-sync">
            <div class="profile-icon-big"><i class="fas fa-user-circle"></i></div>
            <div class="profile-name-sync">JIN S.</div>
            <div class="staff-badge">OTHER DEPARTMENT<i class="fas fa-cog"></i></div>
        </div>
    </a>

    <div class="menu">

        <button class="sidebar-action-btn btn-new" onclick="window.location.href='OUTSIDE_CREATE_TICKET.html'">
            <i class="fas fa-plus"></i> <span>NEW</span>
        </button>

        <!-- TICKETS = HOMEPAGE -->
        <a href="OUTSIDE_HOMEPAGE.html" class="menu-item">
            <i class="fas fa-ticket-alt"></i> <span>HOME</span>
        </a>

        <!-- NOTIFICATION -->
        <div class="menu-item" onclick="openNotif()">
            <i class="fas fa-bell"></i> <span>NOTIFICATION</span>
        </div>

        <!-- SETTINGS -->
        <a href="OUTSIDE_SETTINGS.html" class="menu-item active">
            <i class="fas fa-cog"></i> <span>SETTINGS</span>
        </a>

        <!-- FAQS -->
        <a href="OUTSIDE_FAQS.html" class="menu-item">
            <i class="fas fa-question-circle"></i> <span>FAQs</span>
        </a>
    </div>

    <a href="OUTSIDE_LOGIN.html" class="signout hide-on-collapse" id="signOutBtn">
        <i class="fas fa-sign-out-alt"></i> <span>SIGN OUT</span>
    </a>
</div>

<div class="main-wrapper">
    <div class="page-header" onclick="window.location.href='STAFF HOMEPAGE!.html'">
        <i class="fas fa-chevron-left"></i>
        <h2>Settings</h2>
    </div>

    <div id="settingsContentView">
        <div class="settings-card">
            <div class="user-icon-large">
                <i class="fas fa-user-circle"></i>
            </div>
            <div class="user-title">JIN SHERVE</div>
            <div class="role-pill">
                <span id="displayRole">OTHER DEPARTMENT | HR</span>
                <i class="fas fa-edit" id="editRoleIcon" title="Edit Role Details"></i>
            </div>

            <button class="report-btn" onclick="openBugReport()">
                <i class="fas fa-exclamation-circle"></i> REPORT A BUG
            </button>

            <button class="logout-btn-large" id="mainSignOutBtn">
                <i class="fas fa-sign-out-alt"></i> SIGN OUT
            </button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="editRoleModal">
    <div class="modal-content">
        <h3>Edit Profile Role</h3>
        <input type="text" id="roleInput" class="modal-input" placeholder="e.g. STAFF | J.O. I">
        <div style="margin-top:20px; text-align:right;">
            <button id="cancelEditBtn" style="padding:8px 15px; cursor:pointer; border:none; border-radius:4px;">Cancel</button>
            <button class="btn-save" id="saveEditBtn">Save</button>
        </div>
    </div>
</div>

<div id="notifOverlay">
    <div class="notification-panel">
        <i class="fas fa-times" onclick="closeNotif()" style="float:right; cursor:pointer;"></i>
        <i class="fas fa-bell" style="font-size:3vw; margin-bottom:15px;"></i>
        <h3>NOTIFICATIONS</h3>
        <div id="notifList" style="margin:20px 0;">
            <div style="background:white; color:black; padding:15px; border-radius:8px; cursor:pointer; font-weight:bold;"> Ticket has been created</div style="background:white; color:black; padding:15px; border-radius:8px; cursor:pointer; font-weight:bold;">
        </div>
        <button onclick="clearAll()" style="background:white; color:#0b4a7a; border:none; padding:10px 20px; border-radius:20px; font-weight:bold; cursor:pointer;">Clear All</button>
    </div>
</div>

<div id="bugOverlay">
    <div class="bug-container">
        <i class="fas fa-times" onclick="closeBugReport()" style="float:right; cursor:pointer;"></i>
        <h3><i class="fas fa-bug"></i> REPORT A BUG</h3>
        <textarea class="bug-textarea" id="bugInput" placeholder="Describe the issue here..."></textarea>
        <div style="text-align: center;">
            <button onclick="submitBug()" style="margin-top:20px; padding:12px 40px; cursor:pointer; font-weight:bold; border:none; border-radius:8px; background: white; color: #0b4a7a;">SUBMIT</button>
        </div>
    </div>
</div>

<script>
    const toggleBtn = document.getElementById('toggleBtn');
    const sidebar = document.getElementById('sidebar');

    toggleBtn.addEventListener('click', () => {
        sidebar.classList.toggle('collapsed');
    });

    // Edit Role logic
    const editRoleIcon = document.getElementById('editRoleIcon');
    const editRoleModal = document.getElementById('editRoleModal');
    const roleInput = document.getElementById('roleInput');
    const displayRole = document.getElementById('displayRole');
    const sidebarBadgeRole = document.getElementById('sidebarBadgeRole');

    editRoleIcon.addEventListener('click', () => {
        editRoleModal.classList.add('show');
        roleInput.value = displayRole.innerText;
    });

    document.getElementById('cancelEditBtn').addEventListener('click', () => editRoleModal.classList.remove('show'));

    document.getElementById('saveEditBtn').addEventListener('click', () => {
        const val = roleInput.value.trim();
        if(val) {
            displayRole.innerText = val;
            sidebarBadgeRole.innerHTML = val + ' <i class="fas fa-cog"></i>';
        }
        editRoleModal.classList.remove('show');
    });

    // Notifications
    function openNotif() { document.getElementById("notifOverlay").style.display="flex"; }
    function closeNotif() { document.getElementById("notifOverlay").style.display="none"; }
    function clearAll() {
        document.getElementById("notifList").innerHTML = "<div style='opacity:.6; font-style: Segoe UI; color:white;'>No new notifications</div>";
    }

    // Bug Report
    function openBugReport() { document.getElementById("bugOverlay").style.display="flex"; }
    function closeBugReport() { document.getElementById("bugOverlay").style.display="none"; }
    function submitBug() {
        if(document.getElementById("bugInput").value.trim()){
            alert("Bug report submitted successfully!");
            document.getElementById("bugInput").value = "";
            closeBugReport();
        } else {
            alert("Please describe the issue.");
        }
    }

    // Sign Out
    function handleSignOut(e) {
        e.preventDefault();
        if(confirm("Are you sure you want to sign out?")) {
            window.location.href = "STAFF LOGIN.html";
        }
    }
    document.getElementById("signOutBtn").addEventListener("click", handleSignOut);
    document.getElementById("mainSignOutBtn").addEventListener("click", handleSignOut);
</script>
</body>
</html>
