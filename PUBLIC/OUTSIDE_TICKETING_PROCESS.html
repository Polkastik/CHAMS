<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAMS - Ticket Details</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --hams-blue: #00407a;
            --text-main: #003366;
            --sidebar-active: #eef2f6;
            --sidebar-hover: #eef2f6;
            --border-color: #e0e0e0;
            
            --btn-accept: #007bff;
            --btn-decline: #b30000;
            --status-bg: #ff0000; /* Red for High/Unresolved */
        }

        /* Fluid Reset */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; background-color: #f4f7f9; overflow: hidden; width: 100%; font-size: 100%; }

        /* --- HEADER --- */
        header { 
            background-color: var(--hams-blue); 
            height: 8vh; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 0 2%; 
            position: fixed; 
            top: 0; 
            width: 100%;
            z-index: 1000;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 1.2vw;
            color: white;
        }

        .menu-toggle {
            font-size: 2.2vw;
            cursor: pointer;
            user-select: none;
        }

        .logo-img {
            height: 20vh;
            width: auto;
        }

        .search-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-container input {
            width: 18vw;
            height: 4vh;
            border-radius: 0.4vw;
            border: none;
            padding: 0 2.5vw 0 1vw;
            outline: none;
            font-size: 0.85vw;
        }

        .search-container i {
            position: absolute;
            right: 0.8vw;
            color: #0b4a7a;
            font-size: 0.9vw;
            pointer-events: none;
        }

        /* --- NEW SIDEBAR CSS --- */
        .sidebar {
            width: 18%;
            background: #ffffff;
            padding: 2.5vh 1.2%;
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding-top: 8vh; /* Offset for fixed header */
            transition: 0.3s ease;
            border-right: 1px solid var(--border-color);
            overflow: hidden;
            z-index: 900;
            position: fixed;
            left: 0;
            top: 0;
        }

        .profile-card {
            background: #fff;
            padding: 2.5vh 5%;
            text-align: center;
            margin-bottom: 3vh;
            transition: 0.3s ease;
            cursor: pointer;
            text-decoration: none;
        }

        .profile-area-sync { text-align: center; padding: 2vh 5%; transition: opacity 0.2s; }
        .profile-icon-big { font-size: 4.5vw; color: #0b4a7a; margin-bottom: 1vh; }
        .profile-name-sync { font-weight: bold; color: var(--text-main); margin-bottom: 1vh; font-size: 0.95vw; }

        .staff-badge {
            background: white;
            border: 1px solid #ccc;
            border-radius: 1vw;
            padding: 0.2vh 0.8vw;
            font-size: 0.65vw;
            display: inline-block;
            color: var(--text-main);
            font-weight: bold;
            white-space: nowrap;
        }

        .menu { flex: 1; overflow-y: auto; scrollbar-width: none; }
        .menu::-webkit-scrollbar { display: none; }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 0.8vw;
            padding: 1.4vh 10%;
            font-size: 0.85vw;
            font-weight: 600;
            color: #0b4a7a;
            cursor: pointer;
            border-radius: 0.6vw;
            margin-bottom: 0.5vh;
            transition: 0.2s;
            white-space: nowrap;
            text-decoration: none;
        }

        .menu-item i { font-size: 1.3vw; width: 1.5vw; text-align: center; }
        .menu-item:hover, .menu-item.active { background: var(--sidebar-hover); }

        .signout {
            margin-top: auto;
            padding: 1.5vh 10%;
            color: #0b4a7a;
            display: flex;
            align-items: center;
            gap: 0.8vw;
            font-weight: 700;
            font-size: 0.9vw;
            cursor: pointer;
            text-decoration: none;
            border-top: 1px solid #f0f0f0;
        }
        .signout:hover { background: #fff0f0; color: #d11a2a; }

        /* Collapsed Sidebar State */
        .sidebar.collapsed { width: 6.5vw; padding: 8vh 0 2vh 0; }
        .sidebar.collapsed .profile-name-sync,
        .sidebar.collapsed .staff-badge,
        .sidebar.collapsed .hide-on-collapse,
        .sidebar.collapsed .profile-label { display: none !important; }
        .sidebar.collapsed .profile-card { padding: 1vh 0; margin-bottom: 1vh; }
        .sidebar.collapsed .profile-icon-big { font-size: 2.5vw; }
        .sidebar.collapsed .menu-item { flex-direction: column; padding: 1.2vh 0; justify-content: center; gap: 2px; }
        .sidebar.collapsed .menu-item span { display: block !important; font-size: 0.65vw; font-weight: 800; }

        /* --- CONTENT AREA --- */
        .main-wrapper { 
            flex: 1; 
            margin-top: 8vh;
            margin-left: 18%; /* Adjusted to match sidebar width */
            padding: 1% 2%;
            overflow-y: auto;
            position: relative;
            transition: margin-left 0.3s ease;
        }
        .sidebar.collapsed + .main-wrapper { margin-left: 6.5vw; }

        .page-header { 
            display: inline-flex; 
            align-items: center; 
            gap: 0.8rem;
            margin-bottom: 1.5rem; 
            color: var(--hams-blue); 
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s ease;
            padding: 5px;
            border-radius: 8px;
        }
        .page-header:hover { opacity: 0.7; transform: translateX(-5px); }
        .page-header i { font-size: 1.5rem; }
        .page-header h2 { font-size: 1.5rem; text-transform: uppercase; letter-spacing: 1px; }

        /* --- TICKET DETAIL STYLES --- */
        .details-container {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem 2%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            width:100%;
            max-width:1200px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            font-size: 95%;
            gap: 1rem;
        }

        .grid-row { display: flex; justify-content: space-between; margin-bottom: 0.8rem; padding-right: 10%; }
        .label { color: #888; font-weight: bold; width: 40%; }
        .value { color: #000; font-weight: bold; width: 60%; }

        .message-label { font-size: 95%; color: #888; font-weight: bold; margin-bottom: 0.5rem; display: block; }
        .message-box {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 1.5rem;
            min-height: 120px;
            font-size: 95%;
            color: #222;
            font-weight: bold;
            margin-bottom: 2rem;
            background: #fafbfc;
        }

        .status-row { display: flex; align-items: center; margin-bottom: 1rem; font-size: 95%; }
        .status-label { width: 120px; color: #888; font-weight: bold; }
        .status-badge {
            background-color: var(--status-bg);
            color: white;
            padding: 6px 15px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 85%;
            text-transform: uppercase;
        }

        .assigned-badge {
            background-color: var(--hams-blue);
            color: white;
            padding: 6px 15px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 85%;
        }

        .action-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-top: 3rem;
            border-top: 1px solid #eee;
            padding-top: 2rem;
        }

        .action-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            font-size: 85%;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: opacity 0.2s, transform 0.1s;
        }
        .action-btn:hover { opacity: 0.85; transform: translateY(-1px); }
        .btn-decline { background-color: var(--btn-decline); }
        .btn-accept { background-color: var(--btn-accept); }
        .btn-download { background:#154c79; }

        /* NOTIFICATION OVERLAY */
        #notifOverlay{
            position:fixed;
            top:0;
            left:0;
            width:100vw;
            height:100vh;
            background:rgba(0,0,0,0.3);
            display:none;
            align-items:center;
            justify-content:center;
            z-index:3000;
        }

        .notification-panel{
            background:#0b4a7a;
            width:35vw;
            min-width:450px;
            padding:6vh 3vw;
            border-radius:1.5vw;
            text-align:center;
            color:white;
            position:relative;
        }

        .close-notif-x{ position:absolute; top:15px; right:20px; font-size:1.5vw; cursor:pointer; color:white; }
        .main-bell{ font-size:4vw; margin-bottom:2vh; }
        .notif-title{ font-size:2vw; font-weight:bold; margin-bottom:3vh; }
        #notifList{ max-height:40vh; overflow-y:auto; }
        .notif-item{
            background:white;
            color:#333;
            padding:2vh;
            margin-bottom:1vh;
            border-radius:0.6vw;
            display:flex;
            justify-content:space-between;
            cursor:pointer;
            font-weight:bold;
        }
        .clear-btn{
            margin-top:2vh;
            background:white;
            border:none;
            padding:1vh 2vw;
            border-radius:2vw;
            font-weight:bold;
            color:#0b4a7a;
            cursor:pointer;
        }

        @media (max-width: 768px) {
            .info-grid { grid-template-columns: 1fr; }
            .action-buttons { flex-direction: column; }
            .sidebar { width: 0; display: none; }
            .main-wrapper { margin-left: 0; }
        }

        .sidebar-action-btn {
            width: 85%;
            margin: 1vh auto 2vh auto;
            padding: 0.9vh 0;
            border: none;
            border-radius: 999px;
            font-weight: bold;
            font-size: 0.8vw;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5vw;
            transition: 0.2s ease;
        }

        /* GREEN NEW BUTTON */
        .btn-new {
            background: #38c172; /* nice green */
            color: white;
        }

        .btn-new:hover {
            background: #2fa463;
            transform: scale(1.03);
        }

    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <i class="fas fa-bars menu-toggle" id="toggleBtn"></i>
            <img src="CHAMS%20LOGO.png" alt="CHAMS Logo" class="logo-img">
        </div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search...">
            <i class="fas fa-search"></i>
        </div>
    </header>

    <div class="sidebar" id="sidebar">
            <div class="profile-area-sync">
                <div class="profile-icon-big"><i class="fas fa-user-circle"></i></div>
                <div class="profile-name-sync">JIN S.</div>
                <div class="staff-badge">OTHER DEPARTMENT <i class="fas fa-cog"></i></div>
            </div>
        </a>

        <div class="menu">

            <button class="sidebar-action-btn btn-new" onclick="window.location.href='OUTSIDE_CREATE_TICKET.html'">
                <i class="fas fa-plus"></i> <span>NEW</span>
            </button>

            <!-- TICKETS = HOMEPAGE -->
            <a href="OUTSIDE_HOMEPAGE.html" class="menu-item active">
                <i class="fas fa-ticket-alt"></i> <span>HOME</span>
            </a>

            <!-- NOTIFICATION -->
            <div class="menu-item" onclick="openNotif()">
                <i class="fas fa-bell"></i> <span>NOTIFICATION</span>
            </div>

            <!-- SETTINGS -->
            <a href="OUTSIDE_SETTINGS.html" class="menu-item">
                <i class="fas fa-cog"></i> <span>SETTINGS</span>
            </a>

            <!-- FAQS -->
            <a href="OUTSIDE_FAQS.html" class="menu-item">
                <i class="fas fa-question-circle"></i> <span>FAQs</span>
            </a>
        </div>

        <a href="OUTSIDE_LOGIN.html" class="signout hide-on-collapse" id="signOutBtn">
            <i class="fas fa-sign-out-alt"></i> <span>SIGN OUT</span>
        </a>
    </div>

    <div class="main-wrapper">
        <div class="page-header" id="pageHeaderBtn" title="Go back to Tickets">
            <i class="fas fa-chevron-left" id="headerIcon"></i>
            <h2 id="pageTitle">Ticket Details</h2>
        </div>

        <div id="ticketDetailsContentView">
            <div class="details-container">
                <div class="info-grid">
                    <div>
                        <div class="grid-row">
                            <span class="label">Applicant Name:</span>
                            <span class="value" id="dispName">Loading...</span>
                        </div>
                        <div class="grid-row">
                            <span class="label">Ticket Type:</span>
                            <span class="value" id="dispType">Loading...</span>
                        </div>
                    </div>
                    <div>
                        <div class="grid-row">
                            <span class="label">Department:</span>
                            <span class="value" id="dispDept">Loading...</span>
                        </div>
                        <div class="grid-row">
                            <span class="label">Category:</span>
                            <span class="value" id="dispCat">Loading...</span>
                        </div>
                    </div>
                </div>

                <span class="message-label">Message:</span>
                <div class="message-box" id="dispMessage">
                    Loading...
                </div>

                <div class="status-section">
                    <div class="status-row">
                        <span class="status-label">Priority:</span>
                        <span class="status-badge" id="dispPri">HIGH</span>
                    </div>
                    <div class="status-row">
                        <span class="status-label">Status:</span>
                        <span class="status-badge" id="statusDisplay">UNRESOLVED</span>
                    </div>
                    <div class="status-row" style="margin-top: 1.5rem;">
                        <span class="status-label">Assigned to:</span>
                        <span class="assigned-badge" id="dispAgent">Kenneth Fundador</span>
                    </div>
                </div>

                <div class="action-buttons" id="actionButtonsRow">
                    <button class="action-btn btn-decline" id="declineBtn" onclick="processTicket('declined')">FOLLOW UP TICKET</button>
                    <button class="action-btn btn-download" id="downloadBtn" onclick="downloadTicket()">DOWNLOAD <i class="fas fa-download"></i></button>
                </div>
            </div>
        </div>
    </div>

    <div id="notifOverlay">
        <div class="notification-panel">
            <i class="fas fa-times close-notif-x" onclick="closeNotif()"></i>
            <i class="fas fa-bell main-bell"></i>
            <div class="notif-title">NOTIFICATIONS</div>
            <div id="notifList">
                <div class="notif-item" style="margin:20px 0;">
                    <span>Ticket has been created</span>
                </div>
            </div>
            <button class="clear-btn" onclick="clearAll()">Clear All</button>
        </div>
    </div>

    <script>
        // Load Data from LocalStorage
        window.addEventListener('DOMContentLoaded', () => {
            const ticketData = localStorage.getItem('selectedTicket');
            if(ticketData) {
                const ticket = JSON.parse(ticketData);
                document.getElementById('dispName').innerText = ticket.requester;
                document.getElementById('dispType').innerText = ticket.type || "Troubleshooting";
                document.getElementById('dispDept').innerText = ticket.dept;
                document.getElementById('dispCat').innerText = ticket.category;
                document.getElementById('dispMessage').innerHTML = ticket.issue;
                document.getElementById('dispPri').innerText = ticket.priority.toUpperCase();
                document.getElementById('statusDisplay').innerText = ticket.resolution.toUpperCase();
                document.getElementById('dispAgent').innerText = ticket.tech;

                const statusBadge = document.getElementById("statusDisplay");
                const followUpBtn = document.getElementById("declineBtn");

                // ✅ COLOR
                if(ticket.resolution === "Resolved") {
                    statusBadge.style.backgroundColor = "#27ae60";

                    // ✅ HIDE FOLLOW UP BUTTON
                    followUpBtn.style.display = "none";
                }
                
                const priBadge = document.getElementById("dispPri");
                if(ticket.priority === "High") priBadge.style.backgroundColor = "#af0000";
                else priBadge.style.backgroundColor = "#15b900";

            }
        });

        const toggleBtn = document.getElementById('toggleBtn');
        const sidebar = document.getElementById('sidebar');

        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
        });

        document.getElementById('pageHeaderBtn').addEventListener('click', () => {
            window.location.href = "OUTSIDE_HOMEPAGE.html";
        });

        document.getElementById('signOutBtn').addEventListener('click', (e) => {
            e.preventDefault();
            if(confirm("Are you sure you want to sign out?")) {
                document.body.innerHTML = `<div style="display:flex; height:100vh; width:100%; align-items:center; justify-content:center; flex-direction:column; background:var(--hams-blue); color:white;"><i class="fas fa-circle-notch fa-spin" style="font-size: 3rem; margin-bottom: 1rem;"></i><h2>Signing Out...</h2></div>`;
                setTimeout(() => { window.location.href = "OUTSIDE_LOGIN.html"; }, 1500);
            }
        });

        window.processTicket = function(action){
            const statusBadge = document.getElementById("statusDisplay");
            if(action === "declined"){
                if(confirm("Request for Follow up?")){
                    statusBadge.innerText = "FOLLOW UP";
                    statusBadge.style.backgroundColor = "#7f8c8d";
                    document.getElementById("acceptBtn").style.display="none";
                    document.getElementById("declineBtn").style.display="none";
                }
            }
        }

        function downloadTicket(){
            const name = document.getElementById('dispName').innerText;
            const agent = document.getElementById('dispAgent').innerText;
            alert("Download Ticket Report?");
            const content = `Ticket Details\nApplicant: ${name}\nStatus: RESOLVED\nAssigned to: ${agent}`;
            const blob = new Blob([content], { type: "text/plain" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `ticket-report-${name}.txt`;
            link.click();
        }

        function openNotif(){ document.getElementById("notifOverlay").style.display="flex"; }
        function closeNotif(){ document.getElementById("notifOverlay").style.display="none"; }
        function clearAll(){
            document.getElementById("notifList").innerHTML = "<div style='opacity:.6;font-style:italic'>No new notifications</div>";
            document.querySelector(".clear-btn").style.display="none";
        }
    </script>
</body>
</html>
